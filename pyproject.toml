[project]
name = "finalproject_krutikova_M26-555"
version = "0.1.0"
description = "ValutaTrade Hub — консольное приложение для симуляции торговли валютами"
readme = "README.md"
authors = [
    { name = "Kseniia Krutikova", email = "ks-krutikova@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.10.0",
    "requests>=2.32.0",
]

[project.scripts]
project = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]